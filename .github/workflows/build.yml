name: "Build & Release All Platforms"

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # 1. DESKTOP BUILDS (Windows, Linux, macOS)
  # ==========================================
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            os_name: windows
          - platform: ubuntu-latest
            os_name: linux
          - platform: macos-latest
            os_name: macos

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux System Dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 file

      - name: Install Frontend Dependencies
        run: bun install

      - name: Install Tauri CLI
        run: bun add -d @tauri-apps/cli@^2.0.0

      - name: Bootstrap Tauri Workspace
        shell: bash
        run: |
          node << 'EOF'
          const fs = require("fs");
          const zlib = require("zlib");

          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          pkg.scripts = pkg.scripts || {};
          pkg.scripts.tauri = "tauri";
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));

          fs.mkdirSync("src-tauri/src", { recursive: true });

          const cargoToml = `[package]
          name = "hunbatz-artwork-studio"
          version = "1.0.0"
          description = "Professional 2D digital art and illustration studio"
          authors = ["mk0fficial"]
          edition = "2021"

          [lib]
          name = "hunbatz_artwork_studio_lib"
          crate-type = ["staticlib", "cdylib", "rlib"]

          [build-dependencies]
          tauri-build = { version = "2", features = [] }

          [dependencies]
          tauri = { version = "2", features = [] }
          serde = { version = "1", features = ["derive"] }
          serde_json = "1"
          `;
          fs.writeFileSync("src-tauri/Cargo.toml", cargoToml);

          const tauriConf = {
            "$schema": "https://schema.tauri.app/config/2",
            "productName": "Hunbatz-Studio",
            "version": "1.0.0",
            "identifier": "com.mk0fficial.hunbatzartworkstudio",
            "build": {
              "beforeDevCommand": "bun run dev",
              "beforeBuildCommand": "bun run build",
              "devUrl": "http://localhost:3000",
              "frontendDist": "../dist"
            },
            "app": {
              "windows": [
                {
                  "title": "Hunbatz Studio",
                  "width": 1600,
                  "height": 1200
                }
              ]
            },
            "bundle": {
              "active": true,
              "targets": "all",
              "icon": [
                "icons/32x32.png",
                "icons/128x128.png",
                "icons/128x128@2x.png",
                "icons/icon.icns",
                "icons/icon.ico"
              ]
            }
          };
          fs.writeFileSync("src-tauri/tauri.conf.json", JSON.stringify(tauriConf, null, 2));

          fs.writeFileSync("src-tauri/build.rs", "fn main() { tauri_build::build() }\n");
          fs.writeFileSync("src-tauri/src/lib.rs", "#[cfg_attr(mobile, tauri::mobile_entry_point)]\npub fn run() {\n  tauri::Builder::default().run(tauri::generate_context!()).expect(\"error while running tauri application\");\n}\n");
          fs.writeFileSync("src-tauri/src/main.rs", "#![cfg_attr(not(debug_assertions), windows_subsystem = \"windows\")]\nfn main() {\n  hunbatz_artwork_studio_lib::run();\n}\n");

          const w = 512, h = 512;
          const raw = Buffer.alloc(h * (1 + w * 4));
          for (let y = 0; y < h; y++) {
            const rowStart = y * (1 + w * 4);
            raw[rowStart] = 0;
            for (let x = 0; x < w; x++) {
              const p = rowStart + 1 + x * 4;
              raw[p] = 22; raw[p+1] = 68; raw[p+2] = 53; raw[p+3] = 255;
            }
          }
          const crcTable = new Uint32Array(256);
          for (let n = 0; n < 256; n++) {
            let c = n;
            for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
            crcTable[n] = c;
          }
          function crc32(buf) {
            let c = 0xffffffff;
            for (let i = 0; i < buf.length; i++) c = crcTable[(c ^ buf[i]) & 0xff] ^ (c >>> 8);
            return (c ^ 0xffffffff) >>> 0;
          }
          function chunk(type, data) {
            const b = Buffer.alloc(12 + data.length);
            b.writeUInt32BE(data.length, 0);
            b.write(type, 4, 4, "ascii");
            data.copy(b, 8);
            b.writeUInt32BE(crc32(b.slice(4, 8 + data.length)), 8 + data.length);
            return b;
          }
          const ihdr = Buffer.alloc(13);
          ihdr.writeUInt32BE(w, 0); ihdr.writeUInt32BE(h, 4);
          ihdr[8] = 8; ihdr[9] = 6;
          const png = Buffer.concat([
            Buffer.from([0x89,0x50,0x4e,0x47,0x0d,0x0a,0x1a,0x0a]),
            chunk("IHDR", ihdr),
            chunk("IDAT", zlib.deflateSync(raw)),
            chunk("IEND", Buffer.alloc(0))
          ]);
          fs.writeFileSync("app-icon.png", png);
          EOF
          bun x tauri icon app-icon.png

      - name: Build Desktop Binaries
        run: bun x tauri build

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os_name }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

  # ==========================================
  # 2. ANDROID BUILD (.apk)
  # ==========================================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "cmdline-tools;latest platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.3.11579264"

      - name: Install Frontend Dependencies
        run: bun install

      - name: Install Tauri CLI
        run: bun add -d @tauri-apps/cli@^2.0.0

      - name: Bootstrap Tauri Workspace
