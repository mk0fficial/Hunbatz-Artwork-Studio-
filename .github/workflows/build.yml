name: "Build All Platforms"

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  desktop:
    name: desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            args: ''
            rust_targets: ''
          - name: Linux
            platform: ubuntu-22.04
            args: ''
            rust_targets: ''
          - name: macOS Apple Silicon
            platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_targets: 'aarch64-apple-darwin'
          - name: macOS Intel
            platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust_targets: 'x86_64-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: desktop-${{ matrix.name }}

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install JS dependencies
        run: npm install

      - name: Make app icons
        run: npm run icons

      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx tauri
          tagName: v__VERSION__
          releaseName: 'Hunbatz Studio v__VERSION__'
          releaseDraft: true
          args: ${{ matrix.args }}

  android:
    name: android
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK parts and NDK
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Install JS dependencies
        run: npm install

      - name: Make app icons
        run: npm run icons

      - name: Init Android project
        run: npx tauri android init --ci

      - name: Build debug APK (installs without a signing key)
        run: npx tauri android build --apk --debug --ci

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  ios:
    name: ios + ipad
    runs-on: macos-latest
    # Without Apple signing keys this can only build for the simulator.
    # It never blocks the other builds if it fails.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ios

      - name: Install JS dependencies
        run: npm install

      - name: Make app icons
        run: npm run icons

      - name: Init iOS project
        run: npx tauri ios init --ci

      - name: Build for iOS and iPad simulator
        run: npx tauri ios build --debug --target aarch64-sim --ci

      - name: Zip the simulator app
        run: |
          mkdir -p ios-out
          APP=$(find src-tauri/gen/apple -name "*.app" -type d | head -n 1)
          echo "Found: $APP"
          if [ -n "$APP" ]; then ditto -c -k --sequesterRsrc --keepParent "$APP" ios-out/hunbatz-ios-simulator.zip; fi

      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: ios-out/*.zip
          if-no-files-found: warn
