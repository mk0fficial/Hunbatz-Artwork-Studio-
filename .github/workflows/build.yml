name: "Publish Release Binaries"

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-desktop:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Install project dependencies
        run: bun install

      - name: Install Tauri CLI
        run: bun add -d @tauri-apps/cli@latest

      - name: Bootstrap Tauri Rust files, package.json script, and Square Icon
        run: |
          bun -e '
          const fs = require("fs");
          const zlib = require("zlib");

          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          pkg.scripts = pkg.scripts || {};
          pkg.scripts.tauri = "tauri";
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));

          fs.mkdirSync("src-tauri/src", { recursive: true });
          fs.writeFileSync("src-tauri/build.rs", "fn main() { tauri_build::build() }\n");
          fs.writeFileSync("src-tauri/src/lib.rs", "#[cfg_attr(mobile, tauri::mobile_entry_point)]\npub fn run() {\n  tauri::Builder::default().run(tauri::generate_context!()).expect(\"error while running tauri application\");\n}\n");
          fs.writeFileSync("src-tauri/src/main.rs", "#![cfg_attr(not(debug_assertions), windows_subsystem = \"windows\")]\nfn main() {\n  hunbatz_artwork_studio_lib::run();\n}\n");

          const w = 512, h = 512;
          const raw = Buffer.alloc(h * (1 + w * 4));
          for (let y = 0; y < h; y++) {
            const rowStart = y * (1 + w * 4);
            raw[rowStart] = 0;
            for (let x = 0; x < w; x++) {
              const p = rowStart + 1 + x * 4;
              raw[p] = 22; raw[p+1] = 68; raw[p+2] = 53; raw[p+3] = 255;
            }
          }
          const crcTable = new Uint32Array(256);
          for (let n = 0; n < 256; n++) {
            let c = n;
            for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
            crcTable[n] = c;
          }
          function crc32(buf) {
            let c = 0xffffffff;
            for (let i = 0; i < buf.length; i++) c = crcTable[(c ^ buf[i]) & 0xff] ^ (c >>> 8);
            return (c ^ 0xffffffff) >>> 0;
          }
          function chunk(type, data) {
            const b = Buffer.alloc(12 + data.length);
            b.writeUInt32BE(data.length, 0);
            b.write(type, 4, 4, "ascii");
            data.copy(b, 8);
            b.writeUInt32BE(crc32(b.slice(4, 8 + data.length)), 8 + data.length);
            return b;
          }
          const ihdr = Buffer.alloc(13);
          ihdr.writeUInt32BE(w, 0); ihdr.writeUInt32BE(h, 4);
          ihdr[8] = 8; ihdr[9] = 6;
          const png = Buffer.concat([
            Buffer.from([0x89,0x50,0x4e,0x47,0x0d,0x0a,0x1a,0x0a]),
            chunk("IHDR", ihdr),
            chunk("IDAT", zlib.deflateSync(raw)),
            chunk("IEND", Buffer.alloc(0))
          ]);
          fs.writeFileSync("app-icon.png", png);
          '
          bun x tauri icon app-icon.png

      - name: Build Tauri Desktop App
        uses: tauri-apps/tauri-action@v0.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Hunbatz Studio v__VERSION__"
          releaseBody: "Automated desktop installers (.exe, .msi, .dmg, .deb, .rpm, .AppImage) and Android APK"
          releaseDraft: false
          prerelease: false

      - name: Upload Desktop Installers to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installers-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*
          if-no-files-found: ignore

  publish-android:
    runs-on: ubuntu-latest
    needs: publish-desktop
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Install Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Install project dependencies
        run: bun install

      - name: Install Tauri CLI
        run: bun add -d @tauri-apps/cli@latest

      - name: Bootstrap Tauri Rust files, package.json script, and Square Icon
        run: |
          bun -e '
          const fs = require("fs");
          const zlib = require("zlib");

          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          pkg.scripts = pkg.scripts || {};
          pkg.scripts.tauri = "tauri";
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));

          fs.mkdirSync("src-tauri/src", { recursive: true });
          fs.writeFileSync("src-tauri/build.rs", "fn main() { tauri_build::build() }\n");
          fs.writeFileSync("src-tauri/src/lib.rs", "#[cfg_attr(mobile, tauri::mobile_entry_point)]\npub fn run() {\n  tauri::Builder::default().run(tauri::generate_context!()).expect(\"error while running tauri application\");\n}\n");
          fs.writeFileSync("src-tauri/src/main.rs", "#![cfg_attr(not(debug_assertions), windows_subsystem = \"windows\")]\nfn main() {\n  hunbatz_artwork_studio_lib::run();\n}\n");

          const w = 512, h = 512;
          const raw = Buffer.alloc(h * (1 + w * 4));
          for (let y = 0; y < h; y++) {
            const rowStart = y * (1 + w * 4);
            raw[rowStart] = 0;
            for (let x = 0; x < w; x++) {
              const p = rowStart + 1 + x * 4;
              raw[p] = 22; raw[p+1] = 68; raw[p+2] = 53; raw[p+3] = 255;
            }
          }
          const crcTable = new Uint32Array(256);
          for (let n = 0; n < 256; n++) {
            let c = n;
            for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
            crcTable[n] = c;
          }
          function crc32(buf) {
            let c = 0xffffffff;
            for (let i = 0; i < buf.length; i++) c = crcTable[(c ^ buf[i]) & 0xff] ^ (c >>> 8);
            return (c ^ 0xffffffff) >>> 0;
          }
          function chunk(type, data) {
            const b = Buffer.alloc(12 + data.length);
            b.writeUInt32BE(data.length, 0);
            b.write(type, 4, 4, "ascii");
            data.copy(b, 8);
            b.writeUInt32BE(crc32(b.slice(4, 8 + data.length)), 8 + data.length);
            return b;
          }
          const ihdr = Buffer.alloc(13);
          ihdr.writeUInt32BE(w, 0); ihdr.writeUInt32BE(h, 4);
          ihdr[8] = 8; ihdr[9] = 6;
          const png = Buffer.concat([
            Buffer.from([0x89,0x50,0x4e,0x47,0x0d,0x0a,0x1a,0x0a]),
            chunk("IHDR", ihdr),
            chunk("IDAT", zlib.deflateSync(raw)),
            chunk("IEND", Buffer.alloc(0))
          ]);
          fs.writeFileSync("app-icon.png", png);
          '
          bun x tauri icon app-icon.png

      - name: Init Tauri Android
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: bun x tauri android init

      - name: Build Android APK
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: bun x tauri android build --apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-release
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
