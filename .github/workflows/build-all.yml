name: Build Hunbatz All 6 Platforms

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 1. Windows (.exe), Linux (ELF/AppImage base), and macOS (.app / Universal binary)
  desktop:
    name: Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_path: target/x86_64-pc-windows-msvc/release/hunbatz-desktop.exe
          - platform: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_path: target/x86_64-unknown-linux-gnu/release/hunbatz-desktop
          - platform: macos-universal
            os: macos-latest
            target: aarch64-apple-darwin
            artifact_path: target/aarch64-apple-darwin/release/hunbatz-desktop

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Linux Wayland/X11 & Vulkan Headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libvulkan-dev libasound2-dev pkg-config

      - name: Build Desktop Binary
        run: cargo build --release --target ${{ matrix.target }} -p hunbatz-desktop

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hunbatz-${{ matrix.platform }}
          path: ${{ matrix.artifact_path }}

  # 2. Android (Phones, Galaxy Tab, Fire OS) — Compiles .so + UniFFI Kotlin bindings + APK
  android:
    name: Android (ARM64 + x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Setup Java & Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK & cargo-ndk
        run: |
          sdkmanager --install "ndk;27.1.12297006"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> $GITHUB_ENV
          cargo install cargo-ndk

      - name: Build Native Rust Libraries (.so)
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t x86_64 \
            --platform 28 \
            -o android/app/src/main/jniLibs \
            build --release -p hunbatz-ffi

      - name: Generate UniFFI Kotlin Bindings
        run: |
          cargo run -p hunbatz-ffi --features=uniffi/cli -- generate \
            --library android/app/src/main/jniLibs/arm64-v8a/libhunbatz_ffi.so \
            --language kotlin \
            --out-dir android/app/src/main/java

      - name: Build Debug APK (if Gradle wrapper exists)
        if: hashFiles('android/gradlew') != ''
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android Libraries & APK
        uses: actions/upload-artifact@v4
        with:
          name: hunbatz-android
          path: |
            android/app/src/main/jniLibs/
            android/app/build/outputs/apk/debug/*.apk

  # 3. Apple (iOS, iPadOS & Mac Catalyst) — Compiles XCFramework + UniFFI Swift bindings
  apple:
    name: Apple (iOS, iPadOS & Mac)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Apple Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin

      - name: Build iOS/iPadOS Device & Simulator Static Libraries
        run: |
          cargo build --release --target aarch64-apple-ios -p hunbatz-ffi
          cargo build --release --target aarch64-apple-ios-sim -p hunbatz-ffi
          cargo build --release --target aarch64-apple-darwin -p hunbatz-ffi

      - name: Generate UniFFI Swift Bindings
        run: |
          mkdir -p ios/HunbatzApp/Generated
          cargo run -p hunbatz-ffi --features=uniffi/cli -- generate \
            --library target/aarch64-apple-darwin/release/libhunbatz_ffi.dylib \
            --language swift \
            --out-dir ios/HunbatzApp/Generated

      - name: Create Universal XCFramework
        run: |
          rm -rf ios/HunbatzFFI.xcframework
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libhunbatz_ffi.a \
            -headers ios/HunbatzApp/Generated \
            -library target/aarch64-apple-ios-sim/release/libhunbatz_ffi.a \
            -headers ios/HunbatzApp/Generated \
            -output ios/HunbatzFFI.xcframework

      - name: Upload Apple XCFramework & Swift Bindings
        uses: actions/upload-artifact@v4
        with:
          name: hunbatz-apple-ios-ipados-mac
          path: |
            ios/HunbatzFFI.xcframework
            ios/HunbatzApp/Generated/
