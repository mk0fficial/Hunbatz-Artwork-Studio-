name: Release Hunbatz All 6 Platforms

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # 0. Build the Hunbatz React/TypeScript Studio UI once
  build-frontend:
    name: Build Studio Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies & Build Web App
        run: |
          bun install
          bun run build

      - name: Upload Frontend Dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/

  # 1. Windows (.exe/.zip), Linux (.tar.gz), and macOS (.dmg)
  desktop:
    name: Desktop (${{ matrix.platform }})
    needs: [build-frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Download Frontend Dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux WebView & GPU Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libxkbcommon-dev libwayland-dev libx11-dev libvulkan-dev pkg-config

      - name: Build Desktop Release Binary
        run: cargo build --release --target ${{ matrix.target }} -p hunbatz-desktop

      - name: Package Windows Release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-out
          Copy-Item "target/${{ matrix.target }}/release/hunbatz-desktop.exe" "release-out/Hunbatz-Studio-Windows-x64.exe"
          Compress-Archive -Path "release-out/Hunbatz-Studio-Windows-x64.exe" -DestinationPath "release-out/Hunbatz-Studio-Windows-x64.zip"

      - name: Package Linux Release
        if: runner.os == 'Linux'
        run: |
          mkdir -p release-out
          cp target/${{ matrix.target }}/release/hunbatz-desktop release-out/hunbatz-studio-linux-x64
          chmod +x release-out/hunbatz-studio-linux-x64
          tar -czvf release-out/Hunbatz-Studio-Linux-x64.tar.gz -C release-out hunbatz-studio-linux-x64
          rm release-out/hunbatz-studio-linux-x64

      - name: Package macOS .dmg
        if: runner.os == 'macOS'
        run: |
          mkdir -p release-out/HunbatzStudio.app/Contents/MacOS
          cp target/${{ matrix.target }}/release/hunbatz-desktop release-out/HunbatzStudio.app/Contents/MacOS/HunbatzStudio
          hdiutil create -volname "Hunbatz Studio" -srcfolder release-out/HunbatzStudio.app -ov -format UDZO release-out/Hunbatz-Studio-macOS.dmg
          rm -rf release-out/HunbatzStudio.app

      - name: Upload Desktop Release Asset
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release-out/*

  # 2. Android (.apk)
  android:
    name: Android APK
    needs: [build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Frontend Dist into Android Assets
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: android/app/src/main/assets

      - name: Install Rust Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Setup Java & Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK & Build Rust .so
        run: |
          sdkmanager --install "ndk;27.1.12297006"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> $GITHUB_ENV
          cargo install cargo-ndk
          cargo ndk -t arm64-v8a -t x86_64 --platform 28 -o android/app/src/main/jniLibs build --release -p hunbatz-ffi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Unsigned Release APK
        working-directory: android
        run: gradle assembleRelease

      - name: Rename & Upload Android APK
        run: |
          mkdir -p release-out
          cp android/app/build/outputs/apk/release/*.apk release-out/Hunbatz-Studio-Android-Universal.apk

      - name: Upload Android Release Asset
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release-out/*.apk

  # 3. iOS & iPadOS (.ipa)
  apple:
    name: iOS & iPadOS IPA
    needs: [build-frontend]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Frontend Dist into iOS Bundle
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: ios/dist

      - name: Install Rust iOS Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Build Rust iOS Static Library
        run: cargo build --release --target aarch64-apple-ios -p hunbatz-ffi

      - name: Generate Xcode Project & Package Unsigned .ipa
        run: |
          brew install xcodegen || true
          (cd ios && xcodegen generate)
          mkdir -p release-out/Payload
          xcodebuild -project ios/HunbatzApple.xcodeproj -scheme HunbatzApp -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR=$PWD/build-ios
          cp -r build-ios/*.app release-out/Payload/
          (cd release-out && zip -r Hunbatz-Studio-iOS-iPadOS-Unsigned.ipa Payload && rm -rf Payload)

      - name: Upload iOS Release Asset
        uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: release-out/*.ipa

  # 4. Attach ALL 6 Platform Assets to the GitHub Release Page
  publish-release:
    name: Publish GitHub Release
    needs: [desktop, android, apple]
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download All Built Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-release-assets
          merge-multiple: true

      - name: Create Release with All Assets
        uses: softprops/action-gh-release@v2
        with:
          name: Hunbatz Studio ${{ github.ref_name }}
          body: |
            Automated builds for Windows (.exe, .zip), Linux (.tar.gz), macOS (.dmg), Android (.apk), and iOS/iPadOS (.ipa).
          files: all-release-assets/*
