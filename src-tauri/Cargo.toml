[package]
name = "hunbatz-artwork-studio"
version = "1.0.0"
description = "Professional 2D digital art and illustration studio"
authors = ["mk0fficial"]
edition = "2021"

[lib]
name = "hunbatz_artwork_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
